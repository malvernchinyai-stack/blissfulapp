name: Android CI

on:
  push:
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests (money, time zones, error handling, token refresh, idempotency)
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Build test APK (staging → https://app.blissfulevents.co.zw/api/)
        env:
          VERSION_CODE: ${{ github.run_number }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_SENDER_ID: ${{ secrets.FIREBASE_SENDER_ID }}
        run: ./gradlew --no-daemon assembleStaging
      - uses: actions/upload-artifact@v4
        with:
          name: blissful-gigs-testing-apk
          path: android/app/build/outputs/apk/staging/*.apk
      - name: Android lint
        run: ./gradlew --no-daemon lintStaging
      - name: Signed release bundle (only when signing secrets exist)
        if: ${{ env.HAS_KEYSTORE == 'true' }}
        env:
          VERSION_CODE: ${{ github.run_number }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          PRODUCTION_API: ${{ vars.PRODUCTION_API_BASE_URL }}
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
          ./gradlew --no-daemon bundleRelease -PproductionApiBaseUrl="$PRODUCTION_API"
          rm -f "$RUNNER_TEMP/release.jks"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-reports
          path: |
            android/app/build/reports/
            android/app/build/test-results/

  ui-test:
    # Compose UI smoke test on an emulator (API 34).
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          working-directory: android
          script: ./gradlew --no-daemon connectedDebugAndroidTest

  publish-test-apk:
    # Keeps the latest testing APK on the `test-builds` branch so it can be copied to the staging server.
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: blissful-gigs-testing-apk
          path: apk
      - name: Push APK to test-builds branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          mkdir out && cd out
          git init -q -b test-builds
          cp ../apk/*.apk blissful-gigs-testing.apk
          sha256sum blissful-gigs-testing.apk > blissful-gigs-testing.apk.sha256
          printf 'Built from %s (run %s) on %s\n' "$GITHUB_SHA" "$GITHUB_RUN_NUMBER" "$(date -u +%FT%TZ)" > BUILD-INFO.txt
          git add . && git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "Test APK from run $GITHUB_RUN_NUMBER"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" test-builds
